services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techenglish}
      POSTGRES_USER: ${POSTGRES_USER:-techenglish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techenglish} -d ${POSTGRES_DB:-techenglish}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techenglish_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_prod}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-techenglish}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-techenglish}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-replace-in-production-32-chars}
      PLAY_INTEGRITY_STRICT: ${PLAY_INTEGRITY_STRICT:-false}
      VOICE_STORAGE_ENDPOINT: http://minio:9000
      VOICE_STORAGE_BUCKET: techenglish-peer-voice
      VOICE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-techenglish_minio}
      VOICE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_minio_prod}
      PEER_REVIEW_VOICE_TTL_DAYS: "30"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pg_data:
  redis_data:
  minio_data:
